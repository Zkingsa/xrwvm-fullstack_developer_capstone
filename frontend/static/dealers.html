<!DOCTYPE html>
<html>
<head>
    <title>Dealers List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Car Dealership</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Welcome, {{ user.username }}</span>
                    <a class="btn btn-outline-light btn-sm" href="/djangoapi/logout/">Logout</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="/admin/">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h1>Our Dealers</h1>
        <ul class="list-group">
            {% for dealer in dealers %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ dealer.name }} - {{ dealer.state }}
                    <a href="#" class="btn btn-primary btn-sm">Review Dealer</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
