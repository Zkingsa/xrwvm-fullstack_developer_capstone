<!DOCTYPE html>
<html>
<head>
    <title>Post a Review</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Car Dealership</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Welcome, {{ user.username }}</span>
                    <a class="btn btn-outline-light btn-sm" href="/djangoapi/logout/">Logout</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="/admin/">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h1>Post a Review</h1>
        <form action="/djangoapi/submit_review/" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="reviewText" class="form-label">Your Review</label>
                <textarea class="form-control" id="reviewText" name="review" rows="3" placeholder="Write your review here..."></textarea>
            </div>
            <input type="hidden" name="dealer_id" value="{{ dealer_id }}">
            <button type="submit" class="btn btn-primary">Submit Review</button>
        </form>
        <a href="/djangoapi/dealers/" class="btn btn-secondary mt-3">Back to Dealers</a>
    </div>
</body>
</html>
