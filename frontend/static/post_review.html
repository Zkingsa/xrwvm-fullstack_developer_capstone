<!DOCTYPE html>
<html>
<head>
    <title>Post a Review</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Car Dealership</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Welcome, {{ user.username }}</span>
                    <a class="btn btn-outline-light btn-sm" href="/djangoapp/logout/">Logout</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="/admin/">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <h1>Post a Review</h1>
        <form action="/djangoapp/submit_review/" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="reviewText" class="form-label">Your Review</label>
                <textarea class="form-control" id="reviewText" name="review" rows="3" placeholder="Write your review here..." required></textarea>
            </div>
            <div class="mb-3">
                <label for="purchaseDate" class="form-label">Purchase Date</label>
                <input type="date" class="form-control" id="purchaseDate" name="purchase_date" required>
            </div>
            <div class="mb-3">
                <label for="carMake" class="form-label">Car Make</label>
                <select class="form-control" id="carMake" name="car_make" required>
                    <option value="">-- Select Make --</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Honda">Honda</option>
                    <option value="Ford">Ford</option>
                    <option value="BMW">BMW</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="carYear" class="form-label">Car Year</label>
                <input type="number" class="form-control" id="carYear" name="car_year" required>
            </div>
            <button type="submit" class="btn btn-primary">Post Review</button>
        </form>
        <a href="/djangoapp/dealers/" class="btn btn-secondary mt-3">Back to Dealers</a>
    </div>
</body>
</html>
